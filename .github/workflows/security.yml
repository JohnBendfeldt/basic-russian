name: Security audit

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: '0 14 * * 1'

permissions:
  contents: read

jobs:
  audit-runtime:
    name: Audit runtime dependencies (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

  audit-all:
    name: Audit all dependencies (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (all deps)
        run: npm audit

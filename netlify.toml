[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

# Force HTTPS and non-www
[[redirects]]
  from = "http://basicrussian.org/*"
  to = "https://basicrussian.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.basicrussian.org/*"
  to = "https://basicrussian.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.basicrussian.org/*"
  to = "https://basicrussian.org/:splat"
  status = 301
  force = true

# Serve sitemap directly
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# Route .well-known requests to un-dotted directory (Netlify deploy strips leading dot-directories)
[[redirects]]
  from = "/.well-known/*"
  to = "/well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/well-known/*"
  to = "/well-known/:splat"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==============================================================================
# Global Security Headers (OWASP Recommended)
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://login.microsoftonline.com https://accounts.google.com https://github.com; frame-src 'self' https://accounts.google.com https://login.microsoftonline.com https://github.com;"

# Sitemap must be served as XML
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Microsoft identity association must be served as JSON
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

[[headers]]
  for = "/well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

# Service worker and HTML must never be HTTP-cached
# Otherwise Android Chrome won't detect new deployments
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Hashed JS/CSS assets can be cached forever (Vite adds content hashes to filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

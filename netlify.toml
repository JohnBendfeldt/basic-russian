[build]
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_GOOGLE_CLIENT_ID"

# Force HTTPS and non-www
[[redirects]]
  from = "http://basicrussian.org/*"
  to = "https://basicrussian.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.basicrussian.org/*"
  to = "https://basicrussian.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.basicrussian.org/*"
  to = "https://basicrussian.org/:splat"
  status = 301
  force = true

# Serve sitemap and robots directly
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Serve standalone static legal pages directly for OAuth verifiers & crawlers
[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200

# Route .well-known requests to un-dotted directory (Netlify deploy strips leading dot-directories)
[[redirects]]
  from = "/.well-known/microsoft-identity-association"
  to = "/well-known/microsoft-identity-association.json"
  status = 200
  force = true

[[redirects]]
  from = "/well-known/microsoft-identity-association"
  to = "/well-known/microsoft-identity-association.json"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/*"
  to = "/well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/well-known/*"
  to = "/well-known/:splat"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==============================================================================
# Global Security Headers & Default Document Cache Prevention
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "0"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://auth.basiclanguage.school wss://auth.basiclanguage.school https://login.microsoftonline.com https://accounts.google.com https://github.com; frame-src 'self' https://accounts.google.com https://login.microsoftonline.com https://github.com; upgrade-insecure-requests;"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Sitemap and robots.txt must be served with crawler-friendly Content-Type and caching
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Microsoft identity association must be served as JSON
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

[[headers]]
  for = "/well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

# Service worker, registration script, manifest, and HTML entry points must NEVER be cached
# Otherwise iOS Chrome/Safari and Android Chrome will lock onto stale deployments
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed JS/CSS assets can be cached forever (Vite adds content hashes to filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Audio assets (can be cached with revalidation)
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

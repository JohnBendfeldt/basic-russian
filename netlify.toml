[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Force HTTPS and non-www
[[redirects]]
  from = "http://basicrussian.org/*"
  to = "https://basicrussian.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.basicrussian.org/*"
  to = "https://basicrussian.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.basicrussian.org/*"
  to = "https://basicrussian.org/:splat"
  status = 301
  force = true

# Serve sitemap directly
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sitemap must be served as XML
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Service worker and HTML must never be HTTP-cached
# Otherwise Android Chrome won't detect new deployments
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Hashed JS/CSS assets can be cached forever (Vite adds content hashes to filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
